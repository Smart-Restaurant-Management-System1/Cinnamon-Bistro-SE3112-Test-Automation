name: SE3112 Live Identity Service E2E Testing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-identity-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-identity-e2e:
    name: Live Identity Service E2E Testing (H.R.M.A.A. Bandara)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout SE3112 Testing Repository
        uses: actions/checkout@v4

      - name: Checkout Cinnamon Bistro CSP Application
        uses: actions/checkout@v4
        with:
          repository: Smart-Restaurant-Management-System1/Smart-Restaurant-Management-System
          ref: develop
          path: target-app

      - name: Setup .NET SDK (10.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Host Prerequisites
        run: |
          echo "=============================================================================="
          echo " Host Environment Diagnostics"
          echo " Node.js:        $(node -v)"
          echo " npm:            $(npm -v)"
          echo " .NET SDK:       $(dotnet --version)"
          echo " Docker Engine:  $(docker --version)"
          echo " Docker Compose: $(docker compose version)"
          echo "=============================================================================="

      - name: Install CSP Frontend Dependencies
        working-directory: target-app/frontend/restaurant-web
        run: npm ci --ignore-scripts

      - name: Install E2E Dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: Install Playwright Chromium & System Dependencies
        working-directory: e2e-tests
        run: npx playwright install --with-deps chromium

      - name: Execute Live Identity E2E Test Suite
        working-directory: e2e-tests
        env:
          E2E_APP_PATH: ../target-app
          E2E_LIVE_MYSQL_MODE: docker
          CI: 'true'
        run: |
          echo "=============================================================================="
          echo " Executing Live Identity Service Integration Tests"
          echo " Orchestrator:  e2e-tests/live/run-live.mjs"
          echo " Mode:          Docker Compose (compose.mysql.yml)"
          echo " Target CSP:    target-app/ (develop)"
          echo "=============================================================================="
          npm run test:live

      - name: Publish Live E2E Step Summary
        if: always()
        run: |
          echo "### 🌐 Live Identity Service E2E Testing — Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Owner:** H.R.M.A.A. Bandara (IT24100315)" >> $GITHUB_STEP_SUMMARY
          echo "**Integration Orchestrator:** Wijesinghe K (IT24102587)" >> $GITHUB_STEP_SUMMARY
          echo "**Scope:** Live React Frontend + Real .NET 10 Identity Service + Ephemeral MySQL 8" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Mode:** Docker Compose Isolated Container (\`compose.mysql.yml\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "test-reports/e2e-live/run-summary.json" ]; then
            echo "#### Run Summary" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat test-reports/e2e-live/run-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No run-summary.json generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Live E2E Test Reports & Redacted Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-identity-e2e-reports
          path: test-reports/e2e-live/
          if-no-files-found: ignore

