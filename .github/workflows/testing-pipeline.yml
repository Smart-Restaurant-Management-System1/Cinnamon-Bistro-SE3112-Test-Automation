name: SE3112 Automated Testing Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/code-quality-ci-pipeline
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-check:
    name: Verify Repository Foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Testing Repository
        uses: actions/checkout@v4

      - name: Validate Repository Layout
        run: |
          echo "Validating directory structure..."
          for dir in docs unit-tests mutation-tests load-tests e2e-tests quality-checks test-reports scripts .github/workflows; do
            if [ -d "$dir" ]; then
              echo "✓ Directory '$dir' exists."
            else
              echo "✗ Missing directory: '$dir'"
              exit 1
            fi
          done

      - name: Log Foundation Status
        run: |
          echo "=========================================================="
          echo "SE3112 Cinnamon Bistro CSP Test Automation Pipeline"
          echo "Foundation verification passed successfully."
          echo "=========================================================="

  quality-checks:
    name: Code Quality & Metrics (Phase 1)
    needs: foundation-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SE3112 Testing Repository
        uses: actions/checkout@v4

      - name: Checkout Cinnamon Bistro CSP Application
        uses: actions/checkout@v4
        with:
          repository: Smart-Restaurant-Management-System1/Smart-Restaurant-Management-System
          ref: develop
          path: target-app

      - name: Setup .NET SDK (10.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: target-app/frontend/restaurant-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: target-app/frontend/restaurant-web
        run: npm ci

      - name: Execute Code Quality & Metrics Harness
        run: |
          chmod +x quality-checks/run-quality-checks.sh
          bash quality-checks/run-quality-checks.sh target-app

      - name: Upload Quality Reports & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: test-reports/quality/
          if-no-files-found: ignore

  unit-tests:
    name: Unit Testing & Mocking (Perera H.L.P.S. - Pending Phase 2)
    needs: quality-checks
    runs-on: ubuntu-latest
    steps:
      - name: Log Pending Phase 2 Status
        run: |
          echo "=============================================================================="
          echo " [PENDING] Unit Testing & Mocking Suite"
          echo " Individual Owner: Perera H.L.P.S. (IT24101848)"
          echo " Target Scope: Service-level unit tests, parameterized tests, and test doubles"
          echo " Status: Scheduled for Phase 2 implementation."
          echo "=============================================================================="

  mutation-tests:
    name: Mutation Testing (Reserved / Unassigned Scope)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Log Reserved Scope Status
        run: |
          echo "=============================================================================="
          echo " [NOTICE] Mutation Testing Suite (Exploratory / Unassigned)"
          echo " Status: Mutation testing is preserved as an optional exploratory directory"
          echo "         but is NOT one of the 4 individually assessed scopes for SE3112."
          echo "         Not claimed as an implemented group requirement."
          echo "=============================================================================="

  e2e-tests:
    name: UI / End-to-End Testing (H.R.M.A.A. Bandara - Pending Phase 2)
    needs: quality-checks
    runs-on: ubuntu-latest
    steps:
      - name: Log Pending Phase 2 Status
        run: |
          echo "=============================================================================="
          echo " [PENDING] UI / End-to-End Testing Suite"
          echo " Individual Owner: H.R.M.A.A. Bandara (IT24100315)"
          echo " Target Scope: Automated frontend customer journeys, positive & negative flows"
          echo " Status: Scheduled for Phase 2 implementation."
          echo "=============================================================================="

  load-tests:
    name: Load & Performance Testing (D.M.N. Presanjith - Pending Phase 2)
    needs: quality-checks
    runs-on: ubuntu-latest
    steps:
      - name: Log Pending Phase 2 Status
        run: |
          echo "=============================================================================="
          echo " [PENDING] Load & Performance Testing Suite"
          echo " Individual Owner: D.M.N. Presanjith (IT24101505)"
          echo " Target Scope: Endpoint load testing, concurrency profiles, latency percentiles"
          echo " Status: Scheduled for Phase 2 implementation."
          echo "=============================================================================="

  publish-reports:
    name: Consolidated Pipeline Summary
    needs: [quality-checks, unit-tests, mutation-tests, e2e-tests, load-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish Pipeline Summary Notice
        run: |
          echo "=============================================================================="
          echo " [PIPELINE STAGE COMPLETE] Phase 1: Code Quality & CI Integration"
          echo " Code Quality & Metrics checks executed successfully."
          echo " Downstream test suites (Unit, E2E, Load) are preserved for Phase 2."
          echo "=============================================================================="
